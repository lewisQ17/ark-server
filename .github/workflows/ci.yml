name: ci
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Tests
        working-directory: dashboard/server
        run: cargo test --locked
      - name: Clippy
        working-directory: dashboard/server
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Shell-syntax
        run: bash -n ark-manager.sh && bash -n install.sh && bash -n healthcheck.sh && bash -n dashboard/deploy/deploy.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
