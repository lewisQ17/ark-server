[package]
name = "ark-ctl"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure parts of ark-manager.sh and rcon.py in Rust: RCON packets, conf files, launch plan, systemd unit, add-map plan. Anything that would run systemctl/ufw/proton sits behind a trait with a fake."

[lib]
path = "src/lib.rs"

[[bin]]
name = "ark-ctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[workspace]

[lints.clippy]
all = { level = "warn", priority = -1 }
