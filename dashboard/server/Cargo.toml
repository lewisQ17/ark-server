[package]
name = "ark-dashboard"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of the ARK dashboard backend (dashboard/backend/*.js): axum server, Exec trait, in-memory fake VM"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ark-dashboard"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "io-util"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }

[workspace]

[lints.clippy]
all = { level = "warn", priority = -1 }
