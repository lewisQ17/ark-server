[request]
method = "DELETE"
path = "/api/maps"
body = "{}"

[request.headers]
authorization = "Basic YWRtaW46ZHVtbXktZGFzaC1wYXNz"
content-type = "application/json"

[response]
status = 404

[response.headers]
content-security-policy = "default-src 'none'"
